<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MTG card foil — workshop</title>
  <style>
    :root {
      --bg: #0b0814;

      /* Card dimensions — real MTG ratio is 63 × 88mm ≈ 0.716 */
      --card-w: 340px;
      --card-h: 474px;
      --card-radius: 16px;

      /* Frame colors — Izzet (U/R) crossed with purple.
         Mirrors the hero card's blue-left / red-right axis. */
      --border-color:  #050308;
      --izzet-blue:    #1a4b8c;
      --izzet-blue-dk: #0c2444;
      --izzet-red:     #b8351f;
      --izzet-red-dk:  #5a160a;
      --purple-mid:    #3a1f6e;
      --purple-deep:   #1c0e3a;
      --purple-glow:   #b385ff;

      /* Mana symbol colors (authentic MTG mana). */
      --u-fill: linear-gradient(160deg, #d6ecff 0%, #6fb0e8 55%, #2b6bb0 100%);
      --r-fill: linear-gradient(160deg, #ffd7c4 0%, #ec8868 55%, #b13b1c 100%);
      --m-fill: radial-gradient(circle at 35% 30%, #b385ff 0%, #5a2da8 55%, #1c0e3a 100%);

      /* Hairline outlines around inner panels. */
      --hairline: rgba(0, 0, 0, 0.85);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 800px at 50% 30%, #1a1330 0%, #0b0814 60%, #06040d 100%);
      color: #e8e6f2;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      perspective: 1600px;
      padding: 40px 20px 120px;
    }

    .stage-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      transform-style: preserve-3d;
    }

    /* ================================================================
       CARD ARENA — holds the card and its purple aura together.
       Aura is a separate element BEHIND the card (not a pseudo on the
       card itself) so it does NOT rotate with the spin — the aura stays
       put while the card flips through it.
       ================================================================ */
    .card-arena {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      isolation: isolate;
    }

    /* Two-layer aura system, mirrors the hero card's mtgAuraA + mtgRipple:
         .card-aura      → blue→red diagonal bloom (Izzet body glow)
         .card-aura-ring → violet halo RING (site accent, hovers around edges)
       Both blurred heavily so they read as light, not shapes. */
    .card-aura {
      position: absolute;
      inset: -50px;
      pointer-events: none;
      border-radius: 28px;
      filter: blur(40px);
      background: linear-gradient(45deg,
        oklch(0.70 0.22 250 / 0.85) 0%,
        oklch(0.70 0.22 250 / 0.80) 44%,
        oklch(0.68 0.25 28  / 0.80) 56%,
        oklch(0.68 0.25 28  / 0.85) 100%);
      animation: aura-breath 7s ease-in-out infinite;
    }

    .card-aura-ring {
      position: absolute;
      inset: -30px;
      pointer-events: none;
      border-radius: 28px;
      filter: blur(18px);
      background: radial-gradient(ellipse at 50% 50%,
        transparent 42%,
        oklch(0.70 0.14 300 / 0.9)  52%,
        oklch(0.70 0.14 300 / 0.45) 62%,
        transparent 78%);
      animation: aura-ripple 9s ease-in-out infinite;
    }

    /* Slow color breath — the cyan/red blooms breathe with a brief
       scale "hiccup" mid-cycle so the glow feels alive, not metronomic. */
    @keyframes aura-breath {
      0%   { opacity: 0.70; transform: scale(1); }
      30%  { opacity: 0.88; transform: scale(1); }
      47%  { opacity: 0.98; transform: scale(1); }
      49%  { opacity: 1;    transform: scale(1.035); }
      52%  { opacity: 1;    transform: scale(1); }
      70%  { opacity: 0.88; transform: scale(1); }
      100% { opacity: 0.70; transform: scale(1); }
    }

    /* Slower violet ring breath, offset so the two auras peak apart. */
    @keyframes aura-ripple {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.85; }
    }

    /* ================================================================
       CARD ROOT — holds the two faces (front + back) in 3D space.
       No overflow:hidden here — that would flatten preserve-3d in
       some browsers and clip the back during the flip.
       ================================================================ */
    .mtg-card {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      border-radius: var(--card-radius);
      transform-style: preserve-3d;
      transform: perspective(1200px) rotateY(0deg);
      will-change: transform;
      /* IMPORTANT: do NOT use `filter` here — `filter` forces
         transform-style to flatten, which would kill the 3D flip and
         the card-back would never become visible. box-shadow is safe. */
      box-shadow:
        0 32px 60px -18px rgba(0, 0, 0, 0.75),
        0 14px 28px -10px rgba(80, 50, 180, 0.28);
    }

    /* Each face is a positioned, clipped surface; backface-visibility
       hides whichever face is currently pointing away from the camera. */
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: var(--card-radius);
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--border-color);
      /* Site-accent (cyan) hairline rim + inner top highlight.
         Matches the hero card's `box-shadow: 0 0 0 1px var(--accent)`
         pattern so the card edge picks up the cyberpunk theme. */
      box-shadow:
        inset 0 0 0 1px oklch(0.82 0.21 195 / 0.45),
        inset 0 0 14px oklch(0.82 0.21 195 / 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .card-back { transform: rotateY(180deg); }

    /* ================================================================
       FRONT — colored frame + title + art + type + text + P/T + credit
       ================================================================ */
    .card-frame {
      position: absolute;
      inset: 9px;
      border-radius: 9px;
      /* Izzet without purple — blue UL fades through near-black to red LR.
         Corner glows use the site's saturated oklch values so they read
         as light, not painted color. */
      background:
        radial-gradient(80% 60% at 100% 100%, oklch(0.68 0.25 28 / 0.55) 0%, transparent 60%),
        radial-gradient(80% 60% at 0% 0%,     oklch(0.70 0.22 250 / 0.60) 0%, transparent 55%),
        linear-gradient(135deg,
          var(--izzet-blue-dk) 0%,
          #07050d 50%,
          var(--izzet-red-dk) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.6);
      padding: 10px 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Title bar */
    .title-bar {
      flex: 0 0 32px;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.25));
      box-shadow:
        inset 0 0 0 1px var(--hairline),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }
    .card-name {
      flex: 1;
      height: 2px;
      margin-right: 10px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.22) 0%,
        rgba(255,255,255,0.12) 60%,
        transparent 100%);
      border-radius: 1px;
    }

    /* Mana cost pips */
    .mana-cost { display: flex; gap: 5px; }
    .pip {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      box-shadow:
        inset 0 0 0 1px var(--hairline),
        inset 0 1px 1px rgba(255,255,255,0.35),
        0 1px 2px rgba(0,0,0,0.5);
      position: relative;
    }
    .pip-u { background: var(--u-fill); }
    .pip-r { background: var(--r-fill); }
    .pip-m { background: var(--m-fill); }
    .pip::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 3px;
      width: 6px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      filter: blur(0.5px);
    }

    /* Art frame */
    .art-frame {
      flex: 0 0 180px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.35));
      box-shadow:
        inset 0 0 0 1px var(--hairline),
        inset 0 0 0 2px rgba(255,255,255,0.04),
        inset 0 0 40px rgba(0,0,0,0.6);
    }

    /* Type line + lightning set symbol */
    .type-line {
      flex: 0 0 26px;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.22));
      box-shadow: inset 0 0 0 1px var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }
    .type-text {
      flex: 1;
      height: 2px;
      margin-right: 10px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.18) 0%,
        rgba(255,255,255,0.08) 50%,
        transparent 100%);
      border-radius: 1px;
    }
    .set-symbol {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
    }
    .set-symbol svg {
      width: 100%;
      height: 100%;
      /* Cyan glow halo so the bolt reads as electric on the dark frame. */
      filter:
        drop-shadow(0 0 4px oklch(0.82 0.21 195 / 0.85))
        drop-shadow(0 1px 1px rgba(0,0,0,0.6));
    }

    /* Text box */
    .text-box {
      flex: 1;
      position: relative;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(20, 14, 36, 0.4), rgba(8, 4, 20, 0.6));
      box-shadow:
        inset 0 0 0 1px var(--hairline),
        inset 0 1px 0 rgba(255,255,255,0.04),
        inset 0 -1px 0 rgba(0,0,0,0.4);
    }

    /* P/T box, Izzet-red tint */
    .pt-box {
      position: absolute;
      right: -3px;
      bottom: -6px;
      width: 56px;
      height: 24px;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--izzet-red) 0%, var(--izzet-red-dk) 70%, #2a0a04 100%);
      box-shadow:
        inset 0 0 0 1px var(--hairline),
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 2px 4px rgba(0,0,0,0.5);
    }

    /* Credit line */
    .credit-line {
      flex: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      opacity: 0.55;
    }
    .credit-line .crumb {
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 1px;
    }
    .credit-line .crumb.left  { width: 90px; }
    .credit-line .crumb.right { width: 40px; }

    /* ================================================================
       FOIL SHEEN — bottom-left → top-right diagonal sweep.
       Original spec direction. Bands at 115° → run perpendicular,
       sheen translates from off-card BL to off-card TR.
       ================================================================ */
    .foil-sheen {
      position: absolute;
      inset: -25%;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      background: linear-gradient(
        45deg,
        transparent 32%,
        rgba(255, 255, 255, 0.04) 38%,
        rgba(170, 110, 255, 0.30) 42%,
        rgba(120, 220, 255, 0.45) 46%,
        rgba(255, 240, 200, 0.55) 50%,
        rgba(255, 160, 240, 0.45) 54%,
        rgba(140, 255, 200, 0.35) 58%,
        rgba(255, 255, 255, 0.04) 62%,
        transparent 68%
      );
      transform: translate3d(-70%, 70%, 0);
      filter: blur(0.4px);
    }
    .foil-sheen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        45deg,
        transparent 44%,
        rgba(255, 255, 255, 0.55) 49%,
        rgba(255, 255, 255, 0.05) 51%,
        transparent 56%
      );
      mix-blend-mode: screen;
      filter: blur(0.6px);
    }

    /* ================================================================
       CORNER GLEAM — TOP-RIGHT (where the sheen exits).
       Diagonal ✕ cross-sparkle aligned with the BL→TR sweep axis.
       ================================================================ */
    .corner-gleam {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 110px;
      height: 110px;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.2);
      mix-blend-mode: screen;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 1) 0%,
        rgba(255, 250, 210, 0.85) 8%,
        rgba(255, 220, 255, 0.5) 22%,
        rgba(180, 220, 255, 0.22) 45%,
        transparent 70%
      );
      filter: blur(1px);
    }
    .corner-gleam::before,
    .corner-gleam::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
    }
    .corner-gleam::before {
      width: 2px;
      height: 56px;
      transform: translate(-50%, -50%);
    }
    .corner-gleam::after {
      width: 56px;
      height: 2px;
      transform: translate(-50%, -50%);
    }

    /* ================================================================
       CARD BACK — original copyright-safe design.
       Centered hexagonal gem + radial spoke ring + dual title strips.
       Frame is the same Izzet tri-tone but MIRRORED (red UL / blue LR)
       so the back reads as the obverse of the front.
       ================================================================ */
    .back-frame {
      position: absolute;
      inset: 9px;
      border-radius: 9px;
      /* Back is mirrored: red UL / blue LR — corner glows use site oklch. */
      background:
        radial-gradient(80% 60% at 0% 0%,     oklch(0.68 0.25 28 / 0.50) 0%, transparent 60%),
        radial-gradient(80% 60% at 100% 100%, oklch(0.70 0.22 250 / 0.55) 0%, transparent 55%),
        linear-gradient(135deg,
          var(--izzet-red-dk) 0%,
          #07050d 50%,
          var(--izzet-blue-dk) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.6);
      display: grid;
      place-items: center;
    }

    /* Filigree corner ornaments — four L-shaped brackets */
    .back-frame::before,
    .back-frame::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 3px;
    }
    .back-frame::before {
      top: 14px;
      left: 14px;
      border-right: none;
      border-bottom: none;
    }
    .back-frame::after {
      bottom: 14px;
      right: 14px;
      border-left: none;
      border-top: none;
    }

    .back-center {
      position: relative;
      width: 220px;
      height: 220px;
      display: grid;
      place-items: center;
    }

    /* Soft purple bloom behind the gem — pulses during the back-visible
       window so the back has its own rhythm. */
    .back-glow {
      position: absolute;
      inset: -10%;
      pointer-events: none;
      background: radial-gradient(
        circle at center,
        rgba(179, 133, 255, 0.55) 0%,
        rgba(120, 80, 220, 0.28) 32%,
        rgba(60, 30, 140, 0.12) 55%,
        transparent 72%
      );
      filter: blur(14px);
      opacity: 0.55;
    }

    /* Radial spoke ring around the gem */
    .back-ring {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .back-ring svg { width: 100%; height: 100%; }

    /* The hex gem itself — faceted, internal highlight,
       drop-shadow for lift. */
    .back-gem {
      position: relative;
      width: 110px;
      height: 110px;
      /* Stronger violet halo — matches the aura ring color. */
      filter:
        drop-shadow(0 0 12px oklch(0.70 0.14 300 / 0.95))
        drop-shadow(0 0 28px oklch(0.70 0.14 300 / 0.45));
    }

    /* Title strips above + below the emblem (placeholder hairlines that
       echo the front's "name underline" without using any text). */
    .back-strip {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      height: 1px;
      width: 180px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.45) 50%,
        transparent 100%);
    }
    .back-strip-top    { top: 56px; }
    .back-strip-bottom { bottom: 56px; }

    /* A second, finer strip stacked under each title strip for ornament. */
    .back-strip::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 25%;
      width: 50%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.22) 50%,
        transparent 100%);
    }

    /* ================================================================
       SEQUENCE
         0.00 – 1.80s : foil sweeps bottom-left → top-right
         1.55 – 2.20s : top-right gleam blooms
         2.30 – 5.10s : slow card spin with back-pause + pulse
                          0.0-0.7s  rotate front → 90°
                          0.7-1.1s  arrive at back (180°)
                          1.1-1.96s ZOOM + PULSE at back
                          1.96-2.4s rotate back → 270°
                          2.4-2.8s  finish to 360°
       ================================================================ */
    .mtg-card.playing .foil-sheen {
      animation: foil-sweep 1.8s cubic-bezier(0.42, 0, 0.18, 1) forwards;
    }
    .mtg-card.playing .corner-gleam {
      animation: gleam-pulse 0.65s cubic-bezier(0.2, 0.7, 0.3, 1) 1.55s forwards;
    }
    .mtg-card.playing {
      animation: card-spin 4s cubic-bezier(0.45, 0, 0.55, 1) 2.30s forwards;
    }
    .mtg-card.playing .back-glow {
      animation: back-glow-pulse 4s ease-in-out 2.30s forwards;
    }
    /* The gem itself pulses with violet light during the back-visible
       window. Scale + drop-shadow halo both throb on a double-beat. */
    .mtg-card.playing .back-gem {
      animation: gem-pulse 4s ease-in-out 2.30s forwards;
    }

    @keyframes foil-sweep {
      0%   { transform: translate3d(-70%, 70%, 0); opacity: 0; }
      12%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translate3d(70%, -70%, 0); opacity: 0; }
    }

    @keyframes gleam-pulse {
      0%   { opacity: 0; transform: scale(0.2); }
      35%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.5); }
    }

    /* The choreographed 4s spin:
       0%      front, no rotation                                    (0.00s)
       18%     90°, tilted, pushed forward — edge-on flash           (0.72s)
       30%     180° — BACK visible, settled at scale 1.15            (1.20s)
       42%     ZOOM IN to scale 1.35, pushed 120px toward viewer     (1.68s)
       65%     STILL HELD at zoom — gem throbs here                  (2.60s)
       78%     start backing out                                     (3.12s)
       88%     270°, tilted other way                                (3.52s)
       100%    front again, settled                                  (4.00s)

       Back-visible window: 30% → 78% = 48% of 4s = ~1.92s.
       Zoom-held window:    42% → 65% = 23% of 4s = ~0.92s. */
    @keyframes card-spin {
      0%   { transform: perspective(1200px) rotateY(0deg)   rotateX(0deg)  translateZ(0)     scale(1);    }
      18%  { transform: perspective(1200px) rotateY(90deg)  rotateX(8deg)  translateZ(60px)  scale(1.04); }
      30%  { transform: perspective(1200px) rotateY(180deg) rotateX(0deg)  translateZ(60px)  scale(1.15); }
      42%  { transform: perspective(1200px) rotateY(180deg) rotateX(0deg)  translateZ(120px) scale(1.35); }
      65%  { transform: perspective(1200px) rotateY(180deg) rotateX(0deg)  translateZ(120px) scale(1.35); }
      78%  { transform: perspective(1200px) rotateY(180deg) rotateX(0deg)  translateZ(60px)  scale(1.15); }
      88%  { transform: perspective(1200px) rotateY(270deg) rotateX(-8deg) translateZ(60px)  scale(1.04); }
      100% { transform: perspective(1200px) rotateY(360deg) rotateX(0deg)  translateZ(0)     scale(1);    }
    }

    /* Back-glow bloom — brightens with the gem, holds during the zoom-pause. */
    @keyframes back-glow-pulse {
      0%, 25%   { opacity: 0.55; transform: scale(1);    }
      40%       { opacity: 0.85; transform: scale(1.10); }
      50%       { opacity: 1;    transform: scale(1.25); }
      60%       { opacity: 1;    transform: scale(1.25); }
      75%, 100% { opacity: 0.55; transform: scale(1);    }
    }

    /* The gem itself: double-beat purple throb during the zoom-pause.
       Two peaks (at 45% and 60% of the spin timeline) so the gem feels
       like a heart beating, not a single fade. */
    @keyframes gem-pulse {
      0%, 28% {
        transform: scale(1);
        filter:
          drop-shadow(0 0 12px oklch(0.70 0.14 300 / 0.95))
          drop-shadow(0 0 28px oklch(0.70 0.14 300 / 0.45));
      }
      /* First beat — full bloom */
      45% {
        transform: scale(1.18);
        filter:
          drop-shadow(0 0 22px oklch(0.78 0.22 300 / 1))
          drop-shadow(0 0 60px oklch(0.70 0.18 300 / 0.85))
          drop-shadow(0 0 110px oklch(0.70 0.20 300 / 0.55));
      }
      /* Trough between beats */
      53% {
        transform: scale(1.06);
        filter:
          drop-shadow(0 0 14px oklch(0.72 0.18 300 / 0.85))
          drop-shadow(0 0 40px oklch(0.70 0.14 300 / 0.55));
      }
      /* Second beat — even bigger bloom */
      62% {
        transform: scale(1.22);
        filter:
          drop-shadow(0 0 26px oklch(0.80 0.24 300 / 1))
          drop-shadow(0 0 70px oklch(0.70 0.20 300 / 0.95))
          drop-shadow(0 0 130px oklch(0.70 0.22 300 / 0.65));
      }
      78%, 100% {
        transform: scale(1);
        filter:
          drop-shadow(0 0 12px oklch(0.70 0.14 300 / 0.95))
          drop-shadow(0 0 28px oklch(0.70 0.14 300 / 0.45));
      }
    }

    /* ================================================================
       WORKSHOP CONTROLS
       ================================================================ */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #b8b3d6;
    }
    .btn {
      background: rgba(255, 255, 255, 0.06);
      color: #e8e6f2;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255,255,255,0.24); }
    .btn:active { transform: translateY(1px); }
    .hint { opacity: 0.6; }
    kbd {
      font: inherit;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 1px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="stage-inner">
      <div class="card-arena">
        <div class="card-aura"></div>
        <div class="card-aura-ring"></div>
        <div class="mtg-card" id="card">

        <!-- ============ FRONT ============ -->
        <div class="card-face card-front">
          <div class="card-frame">
            <div class="title-bar">
              <div class="card-name"></div>
            </div>
            <div class="art-frame"></div>
            <div class="type-line">
              <div class="type-text"></div>
              <div class="set-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <defs>
                    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%"   stop-color="#a3d1ff" />
                      <stop offset="55%"  stop-color="#c9a3ff" />
                      <stop offset="100%" stop-color="#ff9466" />
                    </linearGradient>
                  </defs>
                  <path d="M13 2 L4 14 H11 L9 22 L20 9 H13 Z"
                        fill="url(#bolt)"
                        stroke="rgba(0,0,0,0.7)"
                        stroke-width="1"
                        stroke-linejoin="round" />
                </svg>
              </div>
            </div>
            <div class="text-box">
              <div class="pt-box"></div>
            </div>
            <div class="credit-line">
              <span class="crumb left"></span>
              <span class="crumb right"></span>
            </div>
          </div>
          <div class="foil-sheen"></div>
          <div class="corner-gleam"></div>
        </div>

        <!-- ============ BACK ============ -->
        <!-- Original copyright-safe back design:
             centered faceted hex gem + radial spoke ring + filigree
             corner brackets + dual title strips. No WotC marks. -->
        <div class="card-face card-back" aria-hidden="true">
          <div class="back-frame">
            <span class="back-strip back-strip-top"></span>
            <div class="back-center">
              <div class="back-glow"></div>
              <div class="back-ring">
                <svg viewBox="-50 -50 100 100">
                  <!-- 12 radial spokes, every 30° -->
                  <g stroke="rgba(255,255,255,0.16)" stroke-width="0.5">
                    <line x1="0" y1="-46" x2="0" y2="-32"/>
                    <line x1="23" y1="-39.8" x2="16" y2="-27.7"/>
                    <line x1="39.8" y1="-23" x2="27.7" y2="-16"/>
                    <line x1="46" y1="0" x2="32" y2="0"/>
                    <line x1="39.8" y1="23" x2="27.7" y2="16"/>
                    <line x1="23" y1="39.8" x2="16" y2="27.7"/>
                    <line x1="0" y1="46" x2="0" y2="32"/>
                    <line x1="-23" y1="39.8" x2="-16" y2="27.7"/>
                    <line x1="-39.8" y1="23" x2="-27.7" y2="16"/>
                    <line x1="-46" y1="0" x2="-32" y2="0"/>
                    <line x1="-39.8" y1="-23" x2="-27.7" y2="-16"/>
                    <line x1="-23" y1="-39.8" x2="-16" y2="-27.7"/>
                  </g>
                  <!-- Outer + inner rings -->
                  <circle cx="0" cy="0" r="46" fill="none"
                          stroke="rgba(255,255,255,0.22)" stroke-width="0.6"/>
                  <circle cx="0" cy="0" r="32" fill="none"
                          stroke="rgba(255,255,255,0.32)" stroke-width="0.6"/>
                </svg>
              </div>
              <svg class="back-gem" viewBox="-50 -50 100 100" aria-hidden="true">
                <defs>
                  <radialGradient id="gemFill" cx="40%" cy="30%" r="80%">
                    <stop offset="0%"   stop-color="#e6d4ff" />
                    <stop offset="35%"  stop-color="#a075f0" />
                    <stop offset="70%"  stop-color="#5a2da8" />
                    <stop offset="100%" stop-color="#1c0e3a" />
                  </radialGradient>
                  <linearGradient id="gemRim" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%"   stop-color="rgba(255,255,255,0.7)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.15)" />
                  </linearGradient>
                </defs>
                <!-- Hexagonal cut -->
                <polygon
                  points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19"
                  fill="url(#gemFill)"
                  stroke="url(#gemRim)"
                  stroke-width="1.2"
                  stroke-linejoin="round"/>
                <!-- Facet spokes from center to each vertex -->
                <g stroke="rgba(255,255,255,0.32)" stroke-width="0.5" fill="none">
                  <line x1="0" y1="0" x2="0"   y2="-38"/>
                  <line x1="0" y1="0" x2="33"  y2="-19"/>
                  <line x1="0" y1="0" x2="33"  y2="19"/>
                  <line x1="0" y1="0" x2="0"   y2="38"/>
                  <line x1="0" y1="0" x2="-33" y2="19"/>
                  <line x1="0" y1="0" x2="-33" y2="-19"/>
                </g>
                <!-- Inner highlight hex -->
                <polygon
                  points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7"
                  fill="none"
                  stroke="rgba(255,255,255,0.5)"
                  stroke-width="0.6"
                  stroke-linejoin="round"/>
                <!-- Bright top facet wash -->
                <polygon
                  points="0,-38 33,-19 0,0 -33,-19"
                  fill="rgba(255,255,255,0.10)"/>
              </svg>
            </div>
            <span class="back-strip back-strip-bottom"></span>
          </div>
        </div>

      </div>
      </div>

      <div class="controls">
        <button class="btn" id="play">Replay</button>
        <span class="hint">click card or press <kbd>R</kbd></span>
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    const playBtn = document.getElementById('play');

    function trigger() {
      card.classList.remove('playing');
      // force reflow so the animation actually restarts
      void card.offsetWidth;
      card.classList.add('playing');
    }

    playBtn.addEventListener('click', trigger);
    card.addEventListener('click', trigger);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') trigger();
    });

    window.addEventListener('load', () => setTimeout(trigger, 350));
  </script>
</body>
</html>
