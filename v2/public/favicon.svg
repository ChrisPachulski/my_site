<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="gemFill" cx="40%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#e6d4ff" />
      <stop offset="35%"  stop-color="#a075f0" />
      <stop offset="70%"  stop-color="#5a2da8" />
      <stop offset="100%" stop-color="#1c0e3a" />
    </radialGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#b385ff" stop-opacity="0.45" />
      <stop offset="60%"  stop-color="#5a2da8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#5a2da8" stop-opacity="0" />
    </radialGradient>
    <filter id="violetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Soft violet halo behind the gem -->
  <rect x="0" y="0" width="64" height="64" fill="url(#bgGlow)" />

  <g transform="translate(32, 32)">
    <!-- Hexagonal cut, faceted -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"
             fill="url(#gemFill)"
             stroke="#a3d1ff"
             stroke-width="1"
             stroke-linejoin="round"
             filter="url(#violetGlow)" />

    <!-- Bright top facet wash -->
    <polygon points="0,-22 19,-11 0,0 -19,-11"
             fill="rgba(255, 255, 255, 0.22)" />

    <!-- Internal facet spokes -->
    <g stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.5">
      <line x1="0" y1="0" x2="0"   y2="-22" />
      <line x1="0" y1="0" x2="19"  y2="-11" />
      <line x1="0" y1="0" x2="19"  y2="11" />
      <line x1="0" y1="0" x2="0"   y2="22" />
      <line x1="0" y1="0" x2="-19" y2="11" />
      <line x1="0" y1="0" x2="-19" y2="-11" />
    </g>

    <!-- Inner highlight hex -->
    <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4"
             fill="none"
             stroke="rgba(255, 255, 255, 0.7)"
             stroke-width="0.6"
             stroke-linejoin="round" />
  </g>
</svg>
