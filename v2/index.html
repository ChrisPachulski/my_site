    <script>
      // Reconcile saved display-mode before paint to avoid FOUC, then load the
      // Orbitron display face only when the cyberpunk vibe survives. Office-hours
      // never paints with Orbitron, so its ~30KB request is wasted there.
      // data-vibe is opt-in here (not in static HTML) so office-hours users
      // never paint cyberpunk styles. Same gate pattern as Orbitron.
      (function () {
        var html = document.documentElement;
        var mode = 'after-hours';
        try {
          if (localStorage.getItem('display-mode') === 'office-hours') mode = 'office-hours';
        } catch (e) { /* localStorage blocked — fall through to default after-hours */ }
        if (mode === 'office-hours') {
          html.setAttribute('data-theme', 'light');
        } else {
          html.setAttribute('data-vibe', 'cyberpunk');
        }
        if (html.getAttribute('data-vibe') === 'cyberpunk' && !document.getElementById('font-orbitron')) {
          var link = document.createElement('link');
          link.id = 'font-orbitron';
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap';
          document.head.appendChild(link);
        }
      })();
    </script>
